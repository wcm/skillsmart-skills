name: Publish skills

on:
  push:
    branches: [main]
    paths: ["skills/**", ".github/**"]
  pull_request:
    paths: ["skills/**", ".github/**"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'skillsmart' }}
      SKILLSMART_URL: ${{ vars.SKILLSMART_URL || 'https://skillsmart.io' }}
      SKILLSMART_PUBLISH_TOKEN: ${{ secrets.SKILLSMART_PUBLISH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate, scan and package
        run: node .github/scripts/publish.mjs --repo . --source free --out .skillsmart-build
      - name: Upload to skillsmart.io
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: node .github/scripts/publish.mjs --repo . --source free --out .skillsmart-build --upload
      - name: Upload skipped
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to publish to skillsmart.io."
