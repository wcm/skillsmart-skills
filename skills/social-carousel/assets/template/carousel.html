<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TOPIC}} — carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- FONTS: see references/carousel-craft.md -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 1080 × 1350 (4:5) — best size for Instagram and LinkedIn carousels. */
  :root {
    --bg: #fff6e9;        /* slide background */
    --ink: #1d1b16;       /* text */
    --accent: #ff6b35;    /* highlight, numbers, progress */
    --soft: #ffe2c6;      /* cards and shapes */
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --body: "DM Sans", system-ui, sans-serif;
    --handle: "{{HANDLE}}";
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e8e4dc; display: flex; flex-wrap: wrap; gap: 32px; padding: 32px; }
  .slide {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background: var(--bg); color: var(--ink); font-family: var(--body);
    padding: 96px 88px 120px; display: flex; flex-direction: column;
  }
  /* Shared furniture: handle bottom-left, progress dots bottom-right */
  .slide::after { content: var(--handle); position: absolute; left: 88px; bottom: 56px; font: 500 26px var(--body); opacity: 0.6; }
  .progress { position: absolute; right: 88px; bottom: 62px; display: flex; gap: 10px; }
  .progress i { width: 14px; height: 14px; border-radius: 50%; background: var(--ink); opacity: 0.18; }
  .progress i.on { opacity: 1; background: var(--accent); }

  /* HOOK — slide 1 */
  .hook { justify-content: center; }
  .hook .kicker { font: 700 28px var(--body); text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 36px; }
  .hook h1 { font: 800 132px/0.95 var(--display); letter-spacing: -0.03em; }
  .hook h1 em { font-style: normal; color: var(--accent); }
  .hook .swipe { margin-top: 56px; font: 500 30px var(--body); display: flex; align-items: center; gap: 16px; }
  .hook .swipe::after { content: "→"; font-size: 44px; color: var(--accent); }
  .hook .blob { position: absolute; right: -180px; top: -160px; width: 620px; height: 620px; border-radius: 42% 58% 61% 39% / 45% 39% 61% 55%; background: var(--soft); z-index: -0; }
  .hook > :not(.blob):not(.progress) { position: relative; }

  /* POINT — middle slides */
  .point .num { font: 800 300px/0.8 var(--display); color: var(--accent); letter-spacing: -0.05em; margin-bottom: 40px; }
  .point h2 { font: 800 84px/1.02 var(--display); letter-spacing: -0.02em; margin-bottom: 36px; }
  .point p { font: 400 40px/1.45 var(--body); max-width: 860px; opacity: 0.85; }
  .point .card { margin-top: auto; background: var(--soft); border-radius: 32px; padding: 40px 44px; font: 500 34px/1.4 var(--body); }
  .point .card b { color: var(--accent); }

  /* CTA — last slide */
  .cta { justify-content: center; background: var(--ink); color: var(--bg); }
  .cta h2 { font: 800 110px/0.98 var(--display); letter-spacing: -0.03em; }
  .cta p { font: 400 40px/1.4 var(--body); margin-top: 36px; opacity: 0.8; }
  .cta .btn { margin-top: 64px; align-self: flex-start; background: var(--accent); color: var(--ink); font: 700 38px var(--body); padding: 28px 48px; border-radius: 999px; }
  .cta .progress i { background: var(--bg); }
</style>
</head>
<body>

<!-- 5–10 slides: 1 hook, 3–8 points, 1 CTA. Duplicate .point for more. Update progress dots. -->

<section class="slide hook" data-export data-name="01">
  <div class="blob"></div>
  <p class="kicker">{{KICKER}}</p>
  <h1>{{HOOK_HTML}}</h1>
  <p class="swipe">Swipe</p>
  <div class="progress"><i class="on"></i><i></i><i></i><i></i><i></i></div>
</section>

<section class="slide point" data-export data-name="02">
  <div class="num">1</div>
  <h2>{{POINT_1_TITLE}}</h2>
  <p>{{POINT_1_BODY}}</p>
  <div class="card">{{POINT_1_EXAMPLE_HTML}}</div>
  <div class="progress"><i></i><i class="on"></i><i></i><i></i><i></i></div>
</section>

<section class="slide point" data-export data-name="03">
  <div class="num">2</div>
  <h2>{{POINT_2_TITLE}}</h2>
  <p>{{POINT_2_BODY}}</p>
  <div class="card">{{POINT_2_EXAMPLE_HTML}}</div>
  <div class="progress"><i></i><i></i><i class="on"></i><i></i><i></i></div>
</section>

<section class="slide point" data-export data-name="04">
  <div class="num">3</div>
  <h2>{{POINT_3_TITLE}}</h2>
  <p>{{POINT_3_BODY}}</p>
  <div class="card">{{POINT_3_EXAMPLE_HTML}}</div>
  <div class="progress"><i></i><i></i><i></i><i class="on"></i><i></i></div>
</section>

<section class="slide cta" data-export data-name="05">
  <h2>{{CTA_TITLE}}</h2>
  <p>{{CTA_BODY}}</p>
  <span class="btn">{{CTA_BUTTON}}</span>
  <div class="progress"><i></i><i></i><i></i><i></i><i class="on"></i></div>
</section>

</body>
</html>
