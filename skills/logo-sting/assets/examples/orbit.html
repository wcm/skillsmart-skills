<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit · Logo Sting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../template/film.css">
<link rel="stylesheet" href="../template/logo-sting.css">
</head>
<body>
<div id="film">
  <div class="bg no-alpha"></div>
  <div class="cam">
    <canvas class="gl"></canvas>
    <canvas class="dots"></canvas>
    <svg class="lines"></svg>
    <i class="pen"></i>
    <div class="final"></div>
    <div class="tagline"></div>
  </div>
</div>

<script src="../template/film.js"></script>
<script src="../template/logo-sting.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────────────────────
   THE STING: the only part you edit (references/looks.md).
   logo: an SVG or a transparent PNG of the user's mark, or a wordmark { text, font, weight }.
   ───────────────────────────────────────────────────────────────────────────── */
const q = new URLSearchParams(location.search);
LogoSting.film({
  look: q.get("look") || "particles",
  logo: "../template/orbit-mark.svg",    // the user's own SVG (or a transparent PNG)
  colors: { bg: "#0B0C10", ink: "#F2F0EA", accent: "#7C8CFF" },
  tagline: "orbit · launching 1 december",
  duration: 6,
});
</script>
</body>
</html>
