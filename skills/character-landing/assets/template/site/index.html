<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Character Landing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <nav class="tabs" role="tablist" aria-label="Character" id="tabs">
    <span class="pill" aria-hidden="true"></span>
  </nav>

  <div class="stage">
    <div class="mascot" id="mascot">
      <div class="shadow" aria-hidden="true"></div>
      <div class="body"><canvas aria-hidden="true"></canvas></div>
    </div>
    <div class="titles" id="titles"></div>
  </div>

  <main class="scroller" id="scroller"></main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
